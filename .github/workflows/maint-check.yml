name: Maint Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  maint-check:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        timeout-minutes: 10
        with:
          github_access_token: ${{ github.token }}

      - name: Check locked Nix configurations and editor
        timeout-minutes: 20
        run: |
          nix flake check --all-systems --no-build --no-write-lock-file
          nix build .#checks.aarch64-darwin.neovim --no-link --no-write-lock-file

      - name: Run maintenance checks
        timeout-minutes: 5
        run: |
          nix develop .#maintenance --no-write-lock-file --command make maint-check

      - name: Install dry-run
        timeout-minutes: 5
        run: |
          nix develop .#maintenance --no-write-lock-file --command bash install.sh --dry-run --yes --without-ssh --without-gpg

      - name: Lint Python
        timeout-minutes: 2
        run: |
          nix develop .#maintenance --no-write-lock-file --command python3 -m py_compile lib/validate_launchd.py

      - name: Biome check
        timeout-minutes: 3
        run: |
          nix develop .#maintenance --no-write-lock-file --command biome check --no-errors-on-unmatched .
