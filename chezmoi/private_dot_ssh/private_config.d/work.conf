# Work GitHub
# Dedicated alias so work repos clone with the work key regardless of directory,
# e.g. `git clone git@github.com-work:Celebratix/<repo>.git`.
# (Repos under ~/Developer/work/ also get this key via git includeIf + core.sshCommand.)
Host github.com-work
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_work
    IdentitiesOnly yes

# Add work-specific hosts here
# Example:
# Host gitlab.company.com
#     HostName gitlab.company.com
#     User git
#     IdentityFile ~/.ssh/id_ed25519_work
